<!-- Global Status Card & Manual Check Trigger -->
{% set c = cfg if (cfg is defined and cfg) else None %}
<div class="bg-gray-800/60 border border-gray-700/60 rounded-lg p-4 mb-6">
  <div class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-1">Global Status</div>
  <div class="text-sm mb-3">
    <span class="text-gray-400">Last Global Check:</span> 
    <span id="global-last-check" class="text-white ml-1">{{ last_check if (last_check is defined and last_check and last_check != 'Never') else (c.last_check if (c and c.last_check) else 'Never') }}</span>
  </div>
  <button type="button" 
          id="btn-check-now" 
          onclick="triggerCheckNow(this)" 
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 py-2 rounded text-sm font-semibold transition cursor-pointer">
    <span>Run Update Check Now (All Servers)</span>
  </button>
</div>
