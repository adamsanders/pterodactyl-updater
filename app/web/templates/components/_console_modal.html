<!-- Draggable Live Console & Telemetry Window -->
<div id="live-console-window" class="hidden fixed top-8 left-8 z-40 w-[640px] max-w-[95vw] bg-gray-900 border border-indigo-500/60 rounded-xl shadow-2xl flex flex-col h-[560px] max-h-[90vh]">
  <!-- Draggable Header -->
  <div id="live-console-header" class="flex justify-between items-center px-4 py-2.5 bg-gray-950/90 border-b border-gray-800 rounded-t-xl cursor-move select-none">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> LIVE
      </span>
      <h3 class="text-xs font-bold text-gray-200">API Console & Call Frequency</h3>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="clearTelemetryLogs()" class="text-gray-400 hover:text-gray-200 text-xs px-2 py-0.5 rounded hover:bg-gray-800 transition" title="Clear console output">Clear Logs</button>
      <button type="button" onclick="toggleLiveConsole()" class="text-gray-400 hover:text-white text-base font-bold px-1.5">&times;</button>
    </div>
  </div>

  <!-- Live Request Log Stream -->
  <div class="p-3 flex-1 flex flex-col min-h-0 bg-gray-950/40">
    <div class="flex justify-between items-center mb-1 text-[11px] text-gray-400 font-semibold uppercase tracking-wider">
      <span>Recent Calls Stream</span>
      <span id="console-stream-status" class="text-[10px] font-mono text-emerald-400">Streaming</span>
    </div>
    <div id="console-log-stream" class="flex-1 overflow-y-auto font-mono text-[11px] bg-gray-950 p-2.5 rounded-lg border border-gray-800/80 space-y-1 select-text">
      <div class="text-gray-500 italic text-[11px] py-4 text-center">Connecting to telemetry feed...</div>
    </div>
  </div>

  <!-- Rolling 60s Call Frequency Table (Calls / Minute) -->
  <div class="p-3 bg-gray-950/80 border-t border-gray-800 flex flex-col h-44">
    <div class="flex justify-between items-center mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-gray-400">
      <span>Endpoint Frequency (Last 60 Seconds)</span>
      <span class="text-[10px] font-normal text-indigo-300">Auto-calculated rolling CPM</span>
    </div>
    <div class="flex-1 overflow-y-auto rounded border border-gray-800/60 bg-gray-900/60">
      <table class="w-full text-left text-[11px]">
        <thead class="bg-gray-950/80 text-gray-400 border-b border-gray-800 text-[10px] sticky top-0 uppercase">
          <tr>
            <th class="py-1 px-3">Endpoint</th>
            <th class="py-1 px-3 text-right">Calls / Min</th>
          </tr>
        </thead>
        <tbody id="console-rates-body" class="divide-y divide-gray-800/50 font-mono text-gray-300">
          <tr>
            <td colspan="2" class="py-3 px-3 text-center text-gray-500 italic">No calls recorded yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
