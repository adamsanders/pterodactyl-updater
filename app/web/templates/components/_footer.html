{% set ver = app_version if (app_version is defined and app_version) else (version if (version is defined and version) else '') %}
{% set commit = commit_code if (commit_code is defined and commit_code) else '' %}

<!-- Version Display & Commit Code Bar -->
<div class="mt-6 pt-3 border-t border-gray-800/60 flex justify-between items-center text-[11px] text-gray-500 select-none">
  <div class="flex items-center gap-2">
    <span>Pterodactyl Multi-Server Auto-Updater</span>
    <span class="text-gray-700">&bull;</span>
    <span class="font-mono text-gray-500 hover:text-gray-400 transition" title="Build Version">v{{ ver }}</span>
  </div>
  <span id="app-commit" class="font-mono text-gray-500 hover:text-gray-400 transition" title="Git Commit Code">commit {{ commit }}</span>
</div>
