services:
  updater:
    build:
      context: .
      args:
        - GIT_COMMIT=${GIT_COMMIT:-}
    container_name: pterodactyl-updater
    environment:
      - GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    ports:
      - "8090:8080" # Maps host port 8090 to internal container port 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
